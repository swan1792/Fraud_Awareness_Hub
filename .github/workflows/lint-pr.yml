name: Lint Branch & Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|chore)\/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "❌ Branch '$BRANCH_NAME' must match feat/*, fix/*, or chore/*"
            echo "   Examples: feat/add-login, fix/rate-limit, chore/update-deps"
            exit 1
          fi
          echo "✅ Branch name valid: $BRANCH_NAME"

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FAIL=0
          while read -r msg; do
            if [[ ! "$msg" =~ ^(feat|fix|docs|build|style|refactor|test|chore|ci):\ .+ ]]; then
              echo "❌ Invalid commit message: $msg"
              echo "   Expected format: <type>: <description>"
              echo "   Types: feat, fix, docs, build, style, refactor, test, chore, ci"
              FAIL=1
            fi
          done < <(git log --format=%s "$BASE_SHA".."$HEAD_SHA")
          exit $FAIL
